[pytest]
# Pytest configuration for LlamaNote
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Exclude root directory from test collection
addopts = --ignore=__init__.py --ignore=main.py --ignore=config.py

# Don't try to import the root __init__.py
norecursedirs = .git .pytest_cache __pycache__ output cache checkpoints offload logs presets src

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
